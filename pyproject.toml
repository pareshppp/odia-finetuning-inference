[project]
name = "odia-finetuning-inference"
version = "0.1.0"
description = "Sarvam-1 fine-tuning (SFT + GRPO) and evaluation pipeline on Odia GSM8K"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core training / inference
    "torch>=2.4,<2.7",
    "transformers>=4.46,<4.50",
    "trl>=0.16,<0.18",          # SFTTrainer uses processing_class= (≥0.16) and GRPOTrainer API stabilized here
    "peft>=0.13,<0.16",
    "bitsandbytes>=0.44,<0.46",
    "accelerate>=1.0,<1.5",
    "datasets>=3.0,<4.0",
    "huggingface_hub>=0.26,<1.0",

    # Config + utils
    "python-dotenv>=1.0",
    "tqdm>=4.66",

    # Eval notebook
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # Experiment tracking
    "comet_ml>=3.47",
    "opik>=1.0",
]

[project.optional-dependencies]
# Optional: fast GRPO rollouts. Only works with USE_QLORA=false.
vllm = ["vllm>=0.6,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
